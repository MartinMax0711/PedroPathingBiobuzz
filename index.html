<!-- Modified for the BIOBUZZ Edition (FTC 2026-2027); based on Pedro-Pathing/Visualizer f54357e. -->
<!doctype html>
<html class="h-full w-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedro Pathing Visualizer · BIOBUZZ Edition</title>
    <meta
      name="description"
      content="Plan, check and animate Pedro Pathing autonomous paths on the FTC 2026-2027 BIOBUZZ field, then export Pedro Pathing 2.x Java or Kotlin code."
    />
    <meta name="application-name" content="PP BIOBUZZ" />
    <meta name="apple-mobile-web-app-title" content="PP BIOBUZZ" />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#171717"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="Pedro Pathing Visualizer · BIOBUZZ Edition" />
    <meta
      property="og:description"
      content="Path planner for the FTC 2026-2027 BIOBUZZ season, built on Pedro Pathing Visualizer."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      // Mirrors App.svelte's applyTheme(); settings live in localStorage
      // "biobuzz_pp_settings" as { version, settings: { theme } }.
      (function () {
        try {
          var raw = localStorage.getItem("biobuzz_pp_settings");
          var settings = raw ? JSON.parse(raw).settings || {} : {};
          var theme = settings.theme || "light";
          var dark =
            theme === "dark" ||
            (theme === "auto" &&
              !!window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", dark ? "#171717" : "#fafafa");
          }
        } catch (e) {
          /* storage blocked or malformed: keep the light default */
        }
      })();
    </script>
  </head>
  <body
    class="h-full w-full bg-neutral-100 font-poppins dark:bg-neutral-950 dark:text-white"
  >
    <noscript>Pedro Pathing Visualizer needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
